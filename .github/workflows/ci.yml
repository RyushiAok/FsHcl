name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore FsHcl.slnx

      - name: Build
        run: dotnet build tests/FsHcl.Tests.fsproj --configuration Release --no-restore

      - name: Build examples
        run: dotnet build examples/HelloLambda/HelloLambda.fsproj --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/FsHcl.Tests.fsproj --configuration Release --no-restore --no-build

      - name: Pack
        run: dotnet pack FsHcl.fsproj --configuration Release --no-restore --no-build --output artifacts
